<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
    <style>
        canvas { border: 1px solid #ccc; margin: 10px; }
        body { font-family: Arial, sans-serif; padding: 20px; }
    </style>
</head>
<body>
    <h2>Favicon Generator for OI Portfolio</h2>
    <canvas id="favicon32" width="32" height="32"></canvas>
    <canvas id="favicon16" width="16" height="16"></canvas>
    
    <div>
        <button onclick="downloadPNG(32)">Download 32x32 PNG</button>
        <button onclick="downloadPNG(16)">Download 16x16 PNG</button>
    </div>

    <script>
        function drawFavicon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Create gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#8b5cf6');
            
            // Draw background circle
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw letters
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.4}px Inter, Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('OI', size/2, size/2);
        }
        
        function downloadPNG(size) {
            const canvas = document.getElementById(`favicon${size}`);
            const link = document.createElement('a');
            link.download = `favicon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        // Draw favicons
        drawFavicon(document.getElementById('favicon32'), 32);
        drawFavicon(document.getElementById('favicon16'), 16);
    </script>
</body>
</html>
